name: Evaluator Release Gate
on:
  push:
    branches: [main, 'feature/**', 'eval/agrisetu-persistent-core']
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  smoke:
    name: Smoke / Node 20
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --ignore-scripts
      - run: npm test
      - run: node tests/persisted-core.cjs
